<div class="header-section">
  <h3>Total Users: {{ userCount() }}</h3>
  <div class="button-group">
    <button class="add-user-btn" (click)="addDummyUser()">Add Dummy User</button>
    <button class="remove-user-btn" (click)="removeLastUser()">Remove Last User</button>
    <button class="load-users-btn" (click)="loadUsers()" [disabled]="isLoading()">
      {{ isLoading() ? 'Loading...' : 'Load from API' }}
    </button>
  </div>
</div>

<!-- Loading indicator -->
<div *ngIf="isLoading()" class="loading-indicator">
  Loading users from API...
</div>

<!-- Error message -->
<div *ngIf="hasError()" class="error-message">
  Error: {{ errorMessage() }}
</div>

<!-- Users listing -->
<div class="person-cards-container" *ngIf="!isLoading()">
  <lib-person-card
    *ngFor="let user of users()"
    [name]="user.name || ''"
    [jobTitle]="user.title || ''"
    [avatarUrl]="user.avatarUrl || ''"
    class="person-card-item"
  ></lib-person-card>
</div>
